name: cron

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cronpulse
      POSTGRES_PASSWORD: cronpulse
      POSTGRES_DB: cronpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: cron:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cronpulse:cronpulse@db:5432/cronpulse
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-https://cron.colinfran.com}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      USESEND_API_KEY: ${USESEND_API_KEY:-}
      USESEND_BASE_URL: ${USESEND_BASE_URL:-https://franceschini.email}
      USESEND_FROM_EMAIL: ${USESEND_FROM_EMAIL:-Cron <no-reply@colinfran.com>}

volumes:
  pgdata:
    name: cronpulse_pgdata
